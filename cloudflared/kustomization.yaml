---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "cloudflared",
  resources: [
    "namespace.yaml",
    "deployment.yaml",
  ],
  images: [{
    name: "docker.io/cloudflare/cloudflared",
    newTag: "2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53",
  }],
  configMapGenerator: [{
    name: "cloudflared-config",
    files: [
      "config.yaml",
    ],
  }],
  secretGenerator: [{
    name: "cloudflared-credentials",
    files: [
      "credentials.json",
    ],
  }],
}
