---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "cloudflared",
  resources: [
    "namespace.yaml",
    "deployment.yaml",
  ],
  images: [{
    name: "docker.io/cloudflare/cloudflared",
    newTag: "2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344",
  }],
  configMapGenerator: [{
    name: "cloudflared-config",
    files: [
      "config.yaml",
    ],
  }],
  secretGenerator: [{
    name: "cloudflared-credentials",
    files: [
      "credentials.json",
    ],
  }],
}
