---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "cloudflared",
  resources: [
    "namespace.yaml",
    "deployment.yaml",
  ],
  images: [{
    name: "docker.io/cloudflare/cloudflared",
    newTag: "2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0",
  }],
  configMapGenerator: [{
    name: "cloudflared-config",
    files: [
      "config.yaml",
    ],
  }],
  secretGenerator: [{
    name: "cloudflared-credentials",
    files: [
      "credentials.json",
    ],
  }],
}
