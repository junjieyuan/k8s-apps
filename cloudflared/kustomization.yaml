---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "cloudflared",
  resources: [
    "namespace.yaml",
    "deployment.yaml",
  ],
  images: [{
    name: "docker.io/cloudflare/cloudflared",
    newTag: "2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9",
  }],
  configMapGenerator: [{
    name: "cloudflared-config",
    files: [
      "config.yaml",
    ],
  }],
  secretGenerator: [{
    name: "cloudflared-credentials",
    files: [
      "credentials.json",
    ],
  }],
}
