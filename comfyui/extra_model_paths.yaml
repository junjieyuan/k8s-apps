---
# Why this file exists: ComfyUI's native loaders only know models/<type>/ paths,
# but the HF hub cache is organized per repo (models--org--repo/snapshots/...).
# Mapping the snapshots here makes cache models appear in the native dropdowns
# without copying files or creating symlinks.
#
# Comfy-Org publishes ComfyUI-native split files whose subdirs are exactly the
# ComfyUI categories, so each repo maps 1:1 onto diffusion_models/text_encoders/
# vae/loras. Most repos keep those under a split_files/ subdir; MiniMax-H3
# keeps them at the snapshot root, so its base_path is the snapshot itself.
# All paths are inside the pod; /hf-cache is the GPU node's read-only virtiofs
# HF hub cache shared with llama-server (no model data hits NFS).
#
# Snapshot hashes are pinned per repo (read from <repo>/refs/main on the host).
# A repo update on the host changes the hash, so this file must be updated to
# follow — deterministic config instead of runtime scanning.
#
# models/ is deliberately read-only and ephemeral in the deployment: zero model
# storage by design, so this config is the only model source.
{
  minimax_h3: {
    base_path: "/hf-cache/models--Comfy-Org--MiniMax-H3/snapshots/dc559027db79c174125df4d827db55cd11178860",
    diffusion_models: "diffusion_models",
    text_encoders: "text_encoders",
    vae: "vae",
  },
}
