---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "comfyui",
  # Plain Kustomize, no helmCharts: this is a simple deployment + service + route
  # (AGENTS.md). configMapGenerator keeps extra_model_paths.yaml in git; its
  # content hash in the ConfigMap name forces the deployment to pick up changes.
  resources: [
    "namespace.yaml",
    "persistentvolume.yaml",
    "persistentvolumeclaim.yaml",
    "deployment.yaml",
    "service.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
  images: [{
    name: "docker.io/yanwk/comfyui-boot",
    newTag: "cu130-slim-v2-20261027@sha256:9c222bf018d44b9490a1e21f832e6555f4845ebd34c57cb2371a6fb246f99e98",
  }],
  configMapGenerator: [{
    name: "comfyui-config",
    files: [
      "extra_model_paths.yaml",
    ],
  }],
}
