apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-hf-cache
spec:
  # A second PV over the same host path as llama-server's llama-models: PVs are
  # cluster-scoped and bind to exactly one PVC, so ComfyUI needs its own PV/PVC
  # to reach the shared data. The path is a read-only virtiofs mount on the GPU
  # node (provisioned in k8s-cluster), so ReadOnlyMany matches reality.
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-models
  local:
    path: /opt/models/huggingface
  # Local PVs must pin the node where the path exists — here the NVIDIA node,
  # matching the deployment's nodeSelector so pod and volume always colocate.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-10de.present
              operator: In
              values:
                - "true"
