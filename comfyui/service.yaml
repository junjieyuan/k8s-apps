apiVersion: v1
kind: Service
metadata:
  name: comfyui
  labels:
    app: comfyui
spec:
  # ClusterIP only: public traffic arrives via the shared Gateway HTTPRoute,
  # so no LoadBalancer/NodePort is needed.
  selector:
    app: comfyui
  ports:
    - port: 8188
      targetPort: 8188
      name: http
