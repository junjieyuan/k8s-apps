apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - harbor.junjie.pro
  rules:
    # The chart's nginx frontend (Service "harbor") routes / to the portal and
    # /api, /v2, /c, /service to core — the same split the chart's built-in
    # Ingress would perform, so one rule covers UI + registry API.
    - backendRefs:
        - name: harbor
          port: 80
