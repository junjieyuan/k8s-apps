---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "harbor",
  helmCharts: [{
    name: "harbor",
    repo: "https://helm.goharbor.io",
    version: "1.19.4", # Harbor OSS v2.15.4
    releaseName: "harbor",
    valuesFile: "values.yaml",
    additionalValuesFiles: [
      "values-secret.yaml",
    ],
  }],
  resources: [
    "namespace.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
}
