---
{
  apiVersion: "apps/v1",
  kind: "Deployment",
  metadata: {
    name: "hermes",
  },
  spec: {
    # Recreate (not rolling): a rolling-update surge would run two
    # replicas sharing /opt/data, which is not safe for concurrent
    # gateway writers (session files, memory stores).
    strategy: {
      type: "Recreate",
    },
    selector: {
      matchLabels: {
        app: "hermes",
      },
    },
    template: {
      metadata: {
        labels: {
          app: "hermes",
        },
      },
      spec: {
        containers: [{
          # s6-based image: "gateway" starts the supervised gateway; the
          # dashboard is supervised alongside when HERMES_DASHBOARD=1.
          name: "hermes",
          image: "docker.io/nousresearch/hermes-agent",
          args: [
            "gateway",
          ],
          env: [{
            name: "API_SERVER_ENABLED",
            value: "true",
          }, {
            # Bind beyond container loopback so the in-cluster Service can
            # reach the API server (it defaults to 127.0.0.1).
            name: "API_SERVER_HOST",
            value: "0.0.0.0",
          }, {
            name: "HERMES_DASHBOARD",
            value: "1",
          }],
          envFrom: [{
            secretRef: {
              name: "hermes-secrets",
            },
          }],
          ports: [{
            containerPort: 9119,
            name: "dashboard",
          }, {
            containerPort: 8642,
            name: "api",
          }],
          resources: {
            requests: {
              cpu: "500m",
              memory: "1Gi",
            },
            limits: {
              cpu: 2,
              memory: "4Gi",
            },
          },
          # Probes hit the API server (8642) /health, not the dashboard
          # (9119): that is the gateway process (the core workload), and
          # /health answers 200 without a key (kubelet can't send a
          # Bearer; /health/detailed wants API_SERVER_KEY).
          livenessProbe: {
            httpGet: {
              path: "/health",
              port: 8642,
            },
            initialDelaySeconds: 60,
            periodSeconds: 30,
          },
          readinessProbe: {
            httpGet: {
              path: "/health",
              port: 8642,
            },
            initialDelaySeconds: 20,
          },
          volumeMounts: [{
            name: "data",
            mountPath: "/opt/data",
          }],
        }],
        volumes: [{
          name: "data",
          persistentVolumeClaim: {
            claimName: "hermes-data",
          },
        }],
      },
    },
  },
}
