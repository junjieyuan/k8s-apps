---
{
  apiVersion: "apps/v1",
  kind: "Deployment",
  metadata: {
    name: "hermes",
  },
  spec: {
    # Recreate (not rolling): a rolling-update surge would run two
    # replicas sharing /opt/data, which is not safe for concurrent
    # gateway writers (session files, memory stores).
    strategy: {
      type: "Recreate",
    },
    selector: {
      matchLabels: {
        app: "hermes",
      },
    },
    template: {
      metadata: {
        labels: {
          app: "hermes",
        },
      },
      spec: {
        containers: [{
          # s6-based image: "gateway" starts the supervised gateway; the
          # dashboard is supervised alongside when HERMES_DASHBOARD=1.
          name: "hermes",
          image: "docker.io/nousresearch/hermes-agent",
          args: [
            "gateway",
          ],
          env: [{
            name: "API_SERVER_ENABLED",
            value: "true",
          }, {
            # API server (8642) is unexposed on purpose (no Service
            # port, no route), but keep 0.0.0.0 instead of the
            # 127.0.0.1 default for future in-cluster callers.
            name: "API_SERVER_HOST",
            value: "0.0.0.0",
          }, {
            name: "HERMES_DASHBOARD",
            value: "1",
          }],
          envFrom: [{
            secretRef: {
              name: "hermes-secrets",
            },
          }],
          ports: [{
            containerPort: 9119,
            name: "dashboard",
          }, {
            containerPort: 8644,
            name: "webhook",
          }],
          resources: {
            requests: {
              cpu: "500m",
              memory: "1Gi",
            },
            limits: {
              cpu: 2,
              memory: "4Gi",
            },
          },
          # Probes hit the webhook adapter (8644) /health rather than
          # the dashboard (9119) or the API server (8642): the webhook
          # is served by the supervised gateway process and answers 200
          # without a key, so kubelet needs no Bearer.
          livenessProbe: {
            httpGet: {
              path: "/health",
              port: 8644,
            },
            initialDelaySeconds: 60,
            periodSeconds: 30,
          },
          readinessProbe: {
            httpGet: {
              path: "/health",
              port: 8644,
            },
            initialDelaySeconds: 20,
          },
          volumeMounts: [{
            name: "data",
            mountPath: "/opt/data",
          }],
        }],
        volumes: [{
          name: "data",
          persistentVolumeClaim: {
            claimName: "hermes-data",
          },
        }],
      },
    },
  },
}
