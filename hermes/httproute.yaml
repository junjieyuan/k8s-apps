---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "hermes",
  },
  spec: {
    parentRefs: [{
      name: "gateway",
      namespace: "gateway",
    }],
    hostnames: [
      "hermes.junjie.pro",
    ],
    rules: [{
      backendRefs: [{
        name: "hermes",
        port: 9119,
      }],
    }],
  },
}
---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "hermes-webhook",
  },
  spec: {
    # Webhook adapter (8644); the dashboard's catch-all redirects unknown
    # paths to its login page, so the webhook needs its own hostname. The
    # installed Gateway API CRD predates rule-level hostnames, so a second
    # HTTPRoute is required instead of one rule per hostname.
    parentRefs: [{
      name: "gateway",
      namespace: "gateway",
    }],
    hostnames: [
      "hermes-webhook.junjie.pro",
    ],
    rules: [{
      backendRefs: [{
        name: "hermes",
        port: 8644,
      }],
    }],
  },
}
