---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "hermes",
  },
  spec: {
    parentRefs: [{
      name: "gateway",
      namespace: "gateway",
    }],
    hostnames: [
      "hermes.junjie.pro",
    ],
    rules: [{
      backendRefs: [{
        name: "hermes",
        port: 9119,
      }],
    }],
  },
}
---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "hermes-api",
  },
  spec: {
    # OpenAI-compatible API server (8642); the dashboard's catch-all
    # redirects unknown paths to its login page, so the API needs its own
    # hostname. The installed Gateway API CRD predates rule-level
    # hostnames, so a second HTTPRoute is required instead of one rule
    # per hostname.
    parentRefs: [{
      name: "gateway",
      namespace: "gateway",
    }],
    hostnames: [
      "hermes-api.junjie.pro",
    ],
    rules: [{
      backendRefs: [{
        name: "hermes",
        port: 8642,
      }],
    }],
  },
}
