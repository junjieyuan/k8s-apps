---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "keycloak",
  configurations: [
    "transformer-config.yaml",
  ],
  secretGenerator: [{
    name: "keycloak-credentials",
    envs: [
      ".env",
    ],
  }, {
    # Keys are fixed by the Keycloak CR's bootstrapAdmin.user.secret
    # schema: username, password.
    name: "keycloak-operator-admin",
    envs: [
      ".env-operator-admin",
    ],
  }],
  resources: [
    "namespace.yaml",
    "keycloak.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
}
