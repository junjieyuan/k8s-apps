---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "keycloak",
  resources: [
    "namespace.yaml",
    "deployment.yaml",
    "service.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
  images: [{
    name: "quay.io/keycloak/keycloak",
    newTag: "26.7.1",
  }],
  secretGenerator: [{
    name: "keycloak-credentials",
    envs: [
      ".env",
    ],
  }],
}
