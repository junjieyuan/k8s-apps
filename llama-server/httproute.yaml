---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "llama-server",
  },
  spec: {
    parentRefs: [{
      name: "gateway",
      namespace: "gateway",
    }],
    hostnames: [
      "llama.junjie.pro",
    ],
    rules: [{
      # Reject /metrics before it reaches the pod: llama-server loads a model
      # on any /metrics request, even with the endpoint disabled
      # (https://github.com/ggml-org/llama.cpp/issues/23096). No backendRefs/
      # filters: the Gateway rejects matching requests with 500 (spec).
      matches: [{
        path: {
          type: "Exact",
          value: "/metrics",
        },
      }],
    }, {
      matches: [{
        path: {
          type: "PathPrefix",
          value: "/",
        },
      }],
      backendRefs: [{
        name: "llama-server",
        port: 9931,
      }],
    }],
  },
}
