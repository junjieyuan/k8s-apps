---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "llama-server",
  configurations: [
    "servicemonitor-secretref.yaml",
  ],
  resources: [
    "namespace.yaml",
    "persistentvolume.yaml",
    "persistentvolumeclaim.yaml",
    "deployment.yaml",
    "service.yaml",
    "servicemonitor.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
  images: [{
    name: "ghcr.io/ggml-org/llama.cpp",
    newTag: "server-cuda13-v0.4.1@sha256:a7dce78362d087abc7a61e621e8d97590319322be665f3c9afebe0c311c7a89d",
  }],
  configMapGenerator: [{
    name: "models-config",
    files: [
      "models.ini",
    ],
  }],
  secretGenerator: [{
    name: "llama-server-key",
    envs: [
      ".env",
    ],
  }],
}
