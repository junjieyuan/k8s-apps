---
{
  apiVersion: "monitoring.coreos.com/v1",
  kind: "ServiceMonitor",
  metadata: {
    name: "llama-server",
  },
  spec: {
    selector: {
      matchLabels: {
        app: "llama-server",
      },
    },
    endpoints: [{
      # Intentionally points at a non-existent path: any request to /metrics
      # triggers a model load/switch, so the scrape must never reach it
      # (https://github.com/ggml-org/llama.cpp/issues/23096). Kept so the
      # target stays visible (dashboards don't break) while scraping fails.
      port: "http",
      path: "/metrics-disabled",
      interval: "30s",
      params: {
        model: [
          "Qwen-3.6-35B-A3B",
        ],
      },
      bearerTokenSecret: {
        name: "llama-server-key",
        key: "LLAMA_API_KEY",
      },
    }],
  },
}
