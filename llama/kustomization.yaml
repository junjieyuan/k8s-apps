---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "llama",
  configurations: [
    "servicemonitor-secretref.yaml",
  ],
  resources: [
    "namespace.yaml",
    "persistentvolume.yaml",
    "persistentvolumeclaim.yaml",
    "deployment.yaml",
    "service.yaml",
    "servicemonitor.yaml",
    "httproute.yaml",
    "dnsendpoint.yaml",
  ],
  images: [{
    name: "ghcr.io/ggml-org/llama.cpp",
    newTag: "server-cuda13-v1.1.0@sha256:9cb1f21c3cd1a540aaeadca5758814013868129c9bc055c2c85c32da1b626a7a",
  }],
  configMapGenerator: [{
    name: "models-config",
    files: [
      "models.ini",
    ],
  }],
  secretGenerator: [{
    name: "llama-key",
    envs: [
      ".env",
    ],
  }],
}
