---
{
  apiVersion: "monitoring.coreos.com/v1",
  kind: "ServiceMonitor",
  metadata: {
    name: "llama",
  },
  spec: {
    selector: {
      matchLabels: {
        app: "llama",
      },
    },
    endpoints: [{
      port: "http",
      path: "/metrics",
      interval: "30s",
      params: {
        model: [
          "Qwen-3.8-27B",
        ],
      },
      bearerTokenSecret: {
        name: "llama-key",
        key: "LLAMA_API_KEY",
      },
    }],
  },
}
